<!--
  Loads the REAL extension files against fake Google Flights rows, so the badge,

-->

<script>
/* Two checks for the failure modes that only show up in a live DOM. Call them
   from the console; each returns a plain pass/fail object.

   detourCheckPress()  -- the toggle must survive a pass landing mid-press.
     A click only fires when mouseup lands on the SAME element that received
     mousedown. The badge used to be rebuilt wholesale on every pass, so any
     pass during the ~100ms a person holds the button destroyed the element and
     the browser produced no click at all -- which is why the button needed
     pressing several times before anything happened.

   detourCheckStarvation() -- passes must keep running while the page churns.
     A plain trailing debounce is starvable: every mutation cleared the pending
     timer, so a page mutating faster than the debounce never got a pass. Google
     Flights polls prices constantly; this went 4+ seconds without a single pass.
*/
window.detourCheckPress = async function () {
  const btn = document.querySelector('#detour-badge button');
  if (!btn) return { pass: false, why: 'no toggle button — nothing was hidden' };
  const before = document.querySelectorAll('.detour-hidden').length;
  btn.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, view: window }));
  run(); run(); run();                                   // passes land mid-press
  const survived = document.querySelector('#detour-badge button') === btn;
  btn.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, cancelable: true, view: window }));
  if (survived) btn.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
  await new Promise((r) => setTimeout(r, 300));
  const after = document.querySelectorAll('.detour-hidden').length;
  return { pass: survived && after !== before, buttonSurvived: survived, before, after };
};

window.detourCheckStarvation = async function (ms = 4000) {
  const churn = setInterval(() => {
    const d = document.createElement('span');
    document.getElementById('rows').appendChild(d);
    d.remove();
  }, 200);
  const t0 = lastRunAt;
  await new Promise((r) => setTimeout(r, ms));
  clearInterval(churn);
  const ran = lastRunAt > t0;
  return { pass: ran, passesRanUnderChurn: ran, msSinceLastPass: Date.now() - lastRunAt };
};

console.log('harness ready — await detourCheckPress(), await detourCheckStarvation()');
</script>
